# Local development stack: API + worker + MongoDB (single-node replica set) + Redis.
#   cp .env.example .env   # fill in secrets
#   docker compose up --build
# For production use managed MongoDB (Atlas) and Redis; see docs/DEPLOYMENT.md.
services:
  mongo:
    image: mongo:7.0
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports: ['27017:27017']
    volumes: ['mongo-data:/data/db']
    healthcheck:
      # Initiates the replica set on first start, then reports healthy once PRIMARY.
      test: >
        mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  api:
    build: .
    env_file: .env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/bizwoke_nova?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/storage
    ports: ['5000:5000']
    volumes: ['storage-data:/app/storage']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: .
    command: ['node', 'dist/jobs/worker.js']
    env_file: .env
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/bizwoke_nova?replicaSet=rs0
      REDIS_URL: redis://redis:6379
      STORAGE_LOCAL_DIR: /app/storage
    volumes: ['storage-data:/app/storage']
    depends_on:
      mongo: { condition: service_healthy }
      redis: { condition: service_healthy }

volumes:
  mongo-data:
  redis-data:
  storage-data:
