      summary: Meta webhook verification handshake
      parameters: [{ name: hub.mode, in: query, schema: { type: string } }, { name: hub.verify_token, in: query, schema: { type: string } }, { name: hub.challenge, in: query, schema: { type: string } }]
      responses: { '200': { description: Echoed challenge, content: { text/plain: { schema: { type: string } } } }, '403': { $ref: '#/components/responses/Error' }, '503': { $ref: '#/components/responses/Error' } }
    post:
      tags: [Webhooks]
      security: [{ whatsappSignature: [] }]
