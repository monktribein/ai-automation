    post:
      tags: [Imports]
      summary: Start an import job (all rows validated first; any invalid row aborts)
      parameters: [{ $ref: '#/components/parameters/Resource' }, { name: duplicateStrategy, in: query, schema: { type: string, enum: [skip, update, fail], default: skip } }]
      requestBody: { required: true, content: { multipart/form-data: { schema: { type: object, required: [file], properties: { file: { type: string, format: binary } } } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' } }
  /api/v1/imports/{jobId}:
    get: { tags: [Imports], summary: Import job status and row errors, parameters: [{ $ref: '#/components/parameters/JobId' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/exports/{resource}:
    post:
      tags: [Exports]
      summary: Start an export job (PII columns only with customers:pii)
      parameters: [{ $ref: '#/components/parameters/Resource' }]
      requestBody: { content: { application/json: { schema: { type: object, properties: { from: { type: string, format: date-time }, to: { type: string, format: date-time }, status: { type: string } } } } } }
      responses: { '202': { $ref: '#/components/responses/Accepted' }, '403': { $ref: '#/components/responses/Error' } }
  /api/v1/exports/{jobId}:
    get: { tags: [Exports], summary: Export job status (with downloadPath when complete), parameters: [{ $ref: '#/components/parameters/JobId' }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/exports/{jobId}/download:
    get: { tags: [Exports], summary: Authorized tenant-scoped download, parameters: [{ $ref: '#/components/parameters/JobId' }], responses: { '200': { $ref: '#/components/responses/Xlsx' }, '404': { $ref: '#/components/responses/Error' }, '409': { $ref: '#/components/responses/Error' } } }

  /api/v1/audit-logs:
    get: { tags: [Governance], summary: Tenant audit log (audit:read), parameters: [{ $ref: '#/components/parameters/Page' }, { $ref: '#/components/parameters/Limit' }, { name: action, in: query, schema: { type: string } }, { name: resourceType, in: query, schema: { type: string } }, { name: actorUserId, in: query, schema: { $ref: '#/components/schemas/ObjectId' } }, { name: from, in: query, schema: { type: string, format: date-time } }, { name: to, in: query, schema: { type: string, format: date-time } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }
  /api/v1/usage:
    get: { tags: [Governance], summary: Usage for a month vs. limits (usage:read), parameters: [{ name: period, in: query, schema: { type: string, example: '2026-10' } }], responses: { '200': { $ref: '#/components/responses/Ok' } } }

  /api/v1/webhooks/whatsapp:
    get:
      tags: [Webhooks]
